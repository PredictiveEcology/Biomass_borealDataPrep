## Thin caller. The job itself lives in PredictiveEcology/actions, so the pins for
## install-spatial-deps, install-Require, install-SpaDES and install-Rmd-pkgs live
## there too and move once, instead of being frozen into this repository on the day
## the file was generated.
##
## The hand-rolled job this replaces had never succeeded: both of its runs failed at
## "Install module package and other dependencies" with `there is no package called
## 'SpaDES.core'`, preceded by a cascade of `could not be installed: SpaDES.docs,
## bslib, fs, kableExtra, rmarkdown, sass, svglite, textshaping; ERROR: configuration
## failed for package 'fs'`. It pinned install-spatial-deps@v0.2, which adds the
## ubuntugis PPA; that PPA's GDAL is ABI-incompatible with the binaries in Posit's
## noble cache, and the shared action stopped adding it some time ago.
##
## It also only triggered on main and master, so nothing on development ever
## rendered, and it used actions/checkout@v4, now forced off its deprecated Node 20.
##
## No `extra-apt` is needed: the six packages the old file installed by hand
## (libcurl4-openssl-dev, libgit2-dev, libglpk-dev, libmagick++-dev, libxml2-dev,
## python3-gdal) are exactly the called workflow's default set, and it wraps them in
## apt retries and timeouts that a bare `sudo apt-get install` did not have.
##
## https://github.com/PredictiveEcology/actions/blob/main/.github/workflows/render-module-rmd.yaml

name: Render module Rmd

on:
  pull_request:
    branches:
      - main
      - master
      - development
  push:
    branches:
      - main
      - master
      - development
    paths:
      - .github/workflows/render-module-rmd.yaml
      - Biomass_borealDataPrep.Rmd
      - Biomass_borealDataPrep.R
  workflow_dispatch:

jobs:
  render-module-rmd:
    ## The called workflow splits `render` (contents: read, which installs and then
    ## executes this module's own code) from `commit` (contents: write, which runs
    ## nothing but git). A called workflow can only reduce what is granted here,
    ## never widen it, so the write scope has to be granted at the call site.
    permissions:
      contents: write
    uses: PredictiveEcology/actions/.github/workflows/render-module-rmd.yaml@main
    with:
      module: Biomass_borealDataPrep
